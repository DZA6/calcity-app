<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}CalCity Manage{% endblock %}</title>
<style>
/* ── CalCity Management Theme ─────────────────────────────────── */
:root {
  --terra: #C67B5C;
  --terra-dark: #A85D3F;
  --terra-light: #F5E6DC;
  --sand: #FDF6F0;
  --warm-white: #FFFAF5;
  --text: #3D2C20;
  --text-light: #8B7355;
  --border: #E8D5C4;
  --danger: #DC3545;
  --danger-bg: #FFF0F0;
  --success: #28A745;
  --success-bg: #F0FFF4;
  --warning: #E8A838;
  --warning-bg: #FFF8EB;
  --info: #5B9BD5;
  --info-bg: #F0F7FF;
  --card-shadow: 0 2px 12px rgba(61,44,32,0.08);
  --radius: 12px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font);
  background: var(--sand);
  color: var(--text);
  min-height: 100vh;
}

/* ── Top Nav ──────────────────────────────────────────────────── */
.topnav {
  background: var(--warm-white);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  display: flex;
  align-items: center;
  height: 60px;
  gap: 24px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.topnav .brand {
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--terra-dark);
  text-decoration: none;
  letter-spacing: -0.3px;
}
.topnav .brand span { color: var(--terra); }
.topnav nav { display: flex; gap: 4px; flex: 1; }
.topnav nav a {
  padding: 8px 16px;
  border-radius: 8px;
  text-decoration: none;
  color: var(--text-light);
  font-size: 0.9rem;
  font-weight: 500;
  transition: all 0.15s;
}
.topnav nav a:hover { background: var(--terra-light); color: var(--terra-dark); }
.topnav nav a.active { background: var(--terra); color: #fff; }
.topnav .user-info {
  font-size: 0.85rem;
  color: var(--text-light);
}

/* ── Main Content ─────────────────────────────────────────────── */
.main {
  max-width: 1100px;
  margin: 0 auto;
  padding: 28px 24px 60px;
}

.page-title {
  font-size: 1.5rem;
  font-weight: 700;
  margin-bottom: 6px;
  color: var(--text);
}
.page-subtitle {
  font-size: 0.9rem;
  color: var(--text-light);
  margin-bottom: 24px;
}

/* ── Cards ────────────────────────────────────────────────────── */
.card {
  background: var(--warm-white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--card-shadow);
}
.card-header {
  font-size: 1rem;
  font-weight: 600;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* ── Stats Row ────────────────────────────────────────────────── */
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 16px;
  margin-bottom: 28px;
}
.stat-card {
  background: var(--warm-white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px;
  box-shadow: var(--card-shadow);
}
a.stat-card {
  display: block;
  color: inherit;
  text-decoration: none;
  transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
}
a.stat-card:hover {
  transform: translateY(-2px);
  border-color: var(--terra);
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
}
a.stat-card:hover .stat-label { color: var(--terra); }
.stat-card .stat-num {
  font-size: 2rem;
  font-weight: 700;
  color: var(--terra-dark);
  line-height: 1;
}
.stat-card .stat-label {
  font-size: 0.8rem;
  color: var(--text-light);
  margin-top: 4px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* ── Tables ───────────────────────────────────────────────────── */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
th {
  text-align: left;
  padding: 10px 14px;
  background: var(--terra-light);
  color: var(--terra-dark);
  font-weight: 600;
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
td { padding: 10px 14px; border-bottom: 1px solid var(--border); }
tr:hover td { background: #FFF9F5; }
tr:last-child td { border-bottom: none; }

/* ── Buttons ──────────────────────────────────────────────────── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 9px 18px;
  border-radius: 8px;
  font-size: 0.875rem;
  font-weight: 600;
  cursor: pointer;
  border: none;
  text-decoration: none;
  transition: all 0.15s;
  font-family: var(--font);
}
.btn-primary { background: var(--terra); color: #fff; }
.btn-primary:hover { background: var(--terra-dark); }
.btn-outline { background: transparent; border: 2px solid var(--terra); color: var(--terra); }
.btn-outline:hover { background: var(--terra-light); }
.btn-sm { padding: 5px 12px; font-size: 0.8rem; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { background: #c82333; }
.btn-success { background: var(--success); color: #fff; }
.btn-group { display: flex; gap: 8px; align-items: center; }
.btn-group-right { display: flex; gap: 8px; margin-left: auto; }

/* ── Forms ────────────────────────────────────────────────────── */
.form-group { margin-bottom: 18px; }
.form-group label {
  display: block;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 6px;
}
.form-group .help {
  font-size: 0.78rem;
  color: var(--text-light);
  font-weight: 400;
  margin-left: 4px;
}
input[type="text"], input[type="url"], input[type="number"],
input[type="datetime-local"], textarea, select {
  width: 100%;
  padding: 10px 14px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  font-size: 0.9rem;
  font-family: var(--font);
  background: var(--warm-white);
  color: var(--text);
  transition: border-color 0.15s;
}
input:focus, textarea:focus, select:focus {
  outline: none;
  border-color: var(--terra);
  box-shadow: 0 0 0 3px rgba(198,123,92,0.12);
}
textarea { min-height: 120px; resize: vertical; }
select { cursor: pointer; }
.file-input {
  padding: 24px;
  border: 2px dashed var(--border);
  border-radius: var(--radius);
  text-align: center;
  cursor: pointer;
  transition: all 0.15s;
  background: #FFFAF7;
}
.file-input:hover { border-color: var(--terra); background: var(--terra-light); }
.file-input input[type="file"] { display: none; }
.file-input .upload-hint { color: var(--text-light); font-size: 0.85rem; }

.checkbox-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 0;
}
.checkbox-row input[type="checkbox"] {
  width: 18px; height: 18px;
  accent-color: var(--terra);
  cursor: pointer;
}
.checkbox-row label { margin: 0; cursor: pointer; }

/* ── Badges ───────────────────────────────────────────────────── */
.badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.3px;
}
.badge-success { background: var(--success-bg); color: #1a7a33; }
.badge-warning { background: var(--warning-bg); color: #8B6914; }
.badge-danger { background: var(--danger-bg); color: #a71d2a; }
.badge-info { background: var(--info-bg); color: #2B5F8A; }
.badge-neutral { background: #F0EDEA; color: #6B5E53; }

/* ── Alert Severity Colors ────────────────────────────────────── */
.severity-emergency { border-left: 4px solid var(--danger); }
.severity-warning { border-left: 4px solid var(--warning); }
.severity-info { border-left: 4px solid var(--info); }

/* ── Media Preview ────────────────────────────────────────────── */
.preview-box {
  margin-top: 12px;
  border-radius: 8px;
  overflow: hidden;
  background: #F5F0EB;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 60px;
}
.preview-box img {
  max-width: 100%;
  max-height: 300px;
  object-fit: contain;
}
.preview-box video {
  max-width: 100%;
  max-height: 300px;
}

/* ── Messages ─────────────────────────────────────────────────── */
.msg {
  padding: 12px 18px;
  border-radius: 8px;
  margin-bottom: 20px;
  font-size: 0.9rem;
  font-weight: 500;
}
.msg-error { background: var(--danger-bg); color: #a71d2a; border: 1px solid #f5c6cb; }
.msg-success { background: var(--success-bg); color: #1a7a33; border: 1px solid #c3e6cb; }

/* ── Quick Actions ────────────────────────────────────────────── */
.quick-actions {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 14px;
  margin-bottom: 28px;
}
.qa-card {
  background: var(--warm-white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  text-decoration: none;
  color: var(--text);
  box-shadow: var(--card-shadow);
  transition: all 0.15s;
  display: flex;
  align-items: center;
  gap: 14px;
}
.qa-card:hover { border-color: var(--terra); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(198,123,92,0.15); }
.qa-card .qa-icon {
  font-size: 1.6rem;
  width: 44px; height: 44px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 10px;
  background: var(--terra-light);
  flex-shrink: 0;
}
.qa-card .qa-text { font-weight: 600; font-size: 0.92rem; }
.qa-card .qa-desc { font-size: 0.78rem; color: var(--text-light); margin-top: 2px; }

/* ── Toggle Switch ────────────────────────────────────────────── */
.toggle {
  position: relative;
  display: inline-block;
  width: 44px; height: 24px;
  cursor: pointer;
}
.toggle input { display: none; }
.toggle .slider {
  position: absolute;
  inset: 0;
  background: #ccc;
  border-radius: 24px;
  transition: 0.2s;
}
.toggle input:checked + .slider { background: var(--success); }
.toggle .slider::before {
  content: "";
  position: absolute;
  width: 18px; height: 18px;
  left: 3px; bottom: 3px;
  background: white;
  border-radius: 50%;
  transition: 0.2s;
}
.toggle input:checked + .slider::before { transform: translateX(20px); }

/* ── Empty State ──────────────────────────────────────────────── */
.empty-state {
  text-align: center;
  padding: 48px 24px;
  color: var(--text-light);
}
.empty-state .empty-icon { font-size: 2.5rem; margin-bottom: 12px; }

/* ── Pagination ───────────────────────────────────────────────── */
.pagination {
  display: flex;
  justify-content: center;
  gap: 6px;
  margin-top: 20px;
}
.pagination a, .pagination span {
  padding: 7px 14px;
  border-radius: 6px;
  font-size: 0.85rem;
  text-decoration: none;
  border: 1px solid var(--border);
  color: var(--text);
}
.pagination a:hover { background: var(--terra-light); }
.pagination .current { background: var(--terra); color: #fff; border-color: var(--terra); }

/* ── Responsive ───────────────────────────────────────────────── */
@media (max-width: 768px) {
  .topnav { flex-wrap: wrap; height: auto; padding: 12px; gap: 8px; }
  .topnav nav { overflow-x: auto; }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .quick-actions { grid-template-columns: 1fr 1fr; }
}

/* ── Animations ───────────────────────────────────────────────── */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes popIn {
  0% { opacity: 0; transform: scale(0.92); }
  70% { transform: scale(1.02); }
  100% { opacity: 1; transform: scale(1); }
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.55; }
}
@keyframes slideDown {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}
.anim-in { animation: fadeInUp 0.4s ease-out both; }
.anim-pop { animation: popIn 0.35s ease-out both; }
.anim-pulse { animation: pulse 2s ease-in-out infinite; }
.anim-slide { animation: slideDown 0.3s ease-out both; }
.stats .stat-card, .quick-actions .qa-card, .card { animation: fadeInUp 0.4s ease-out both; }
.stats .stat-card:nth-child(2) { animation-delay: 0.06s; }
.stats .stat-card:nth-child(3) { animation-delay: 0.12s; }
.stats .stat-card:nth-child(4) { animation-delay: 0.18s; }
.stats .stat-card:nth-child(5) { animation-delay: 0.24s; }
.stats .stat-card:nth-child(6) { animation-delay: 0.3s; }
.quick-actions .qa-card:nth-child(2) { animation-delay: 0.06s; }
.quick-actions .qa-card:nth-child(3) { animation-delay: 0.12s; }
.quick-actions .qa-card:nth-child(4) { animation-delay: 0.18s; }
.quick-actions .qa-card:nth-child(5) { animation-delay: 0.24s; }
.quick-actions .qa-card:nth-child(6) { animation-delay: 0.3s; }
tr { animation: fadeIn 0.25s ease-out both; }

/* Moderation-specific */
.thread-card {
  background: var(--warm-white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 10px;
  transition: all 0.2s;
}
.thread-card:hover { border-color: var(--terra); box-shadow: var(--card-shadow); }
.thread-card .thread-title { font-weight: 600; font-size: 0.95rem; color: var(--text); }
.thread-card .thread-meta { font-size: 0.78rem; color: var(--text-light); margin-top: 3px; }
.comment-row {
  padding: 10px 14px;
  border-left: 3px solid var(--border);
  margin-bottom: 8px;
  background: #FFFDFB;
  border-radius: 0 8px 8px 0;
}
.comment-row:hover { border-left-color: var(--terra); }
.mod-queue-empty {
  text-align: center;
  padding: 32px;
  color: var(--success);
  font-weight: 500;
}
</style>
</head>
<body>

<header class="topnav">
  <a href="{% url 'manage:dashboard' %}" class="brand">&#9729; <span>CalCity</span> Manage</a>
  <nav>
    <a href="{% url 'manage:dashboard' %}" class="{% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">Dashboard</a>
    <a href="{% url 'manage:news_list' %}" class="{% if 'news' in request.resolver_match.url_name %}active{% endif %}">Articles</a>
    <a href="{% url 'manage:moderation' %}" class="{% if 'moderation' in request.resolver_match.url_name or 'topic' in request.resolver_match.url_name or 'comment' in request.resolver_match.url_name %}active{% endif %}">Community</a>
    <a href="{% url 'manage:weather' %}" class="{% if request.resolver_match.url_name == 'weather' %}active{% endif %}">Weather</a>
    <a href="{% url 'manage:alerts' %}" class="{% if 'alert' in request.resolver_match.url_name %}active{% endif %}">Alerts</a>
    <a href="{% url 'manage:events_list' %}" class="{% if 'events' in request.resolver_match.url_name %}active{% endif %}">Events</a>
    <a href="{% url 'manage:businesses_list' %}" class="{% if 'business' in request.resolver_match.url_name %}active{% endif %}">Businesses</a>
    <a href="{% url 'manage:businesses_list' %}?category=freelancer" class="{% if request.GET.category == 'freelancer' %}active{% endif %}">Freelancers</a>
    <a href="{% url 'manage:schools_list' %}" class="{% if 'school' in request.resolver_match.url_name %}active{% endif %}">Schools</a>
    <a href="{% url 'manage:council_list' %}" class="{% if 'council' in request.resolver_match.url_name %}active{% endif %}">Council</a>
    <a href="{% url 'manage:deals_list' %}" class="{% if 'deal' in request.resolver_match.url_name %}active{% endif %}">Deals</a>
    <a href="{% url 'manage:featured_list' %}" class="{% if 'featured' in request.resolver_match.url_name %}active{% endif %}">Featured</a>
  </nav>
  <span class="user-info">{{ user.username }}</span>
</header>

<main class="main">
{% block content %}{% endblock %}
</main>

{% block scripts %}{% endblock %}
</body>
</html>
