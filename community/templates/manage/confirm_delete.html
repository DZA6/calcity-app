{% extends "manage/base.html" %}
{% block title %}Delete {{ type_name }} — CalCity Manage{% endblock %}

{% block content %}
<div class="card" style="max-width:500px;margin:48px auto;text-align:center;">
  <div style="font-size:2.5rem;margin-bottom:12px;">&#128465;</div>
  <h2 style="margin-bottom:8px;">Delete {{ type_name }}?</h2>
  <p style="color:var(--text-light);margin-bottom:8px;">
    "{{ obj }}" will be permanently deleted. This cannot be undone.
  </p>
  <form method="post" style="margin-top:20px;">
    {% csrf_token %}
    <div class="btn-group" style="justify-content:center;">
      <button type="submit" class="btn btn-danger">Delete</button>
      <a href="{{ cancel_url }}" class="btn btn-outline">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
